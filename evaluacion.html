            <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Integral del Medio Ambiente</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary: #0288d1;
            --text: #37474f;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --correct: #4caf50;
            --incorrect: #f44336;
        }
   
        .quiz-container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
            box-sizing: border-box;
        }
     
        .progress-bar {
            height: 6px;
            background-color: var(--primary-light);
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            width: 10%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }
        .question-box h2 {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            background: var(--bg);
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            line-height: 1.4;
        }
        .option-item:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .option-item.correct {
            border-color: var(--correct);
            background-color: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
        }
        .option-item.incorrect {
            border-color: var(--incorrect);
            background-color: #ffebee;
            color: #c62828;
        }
        .rationale {
            margin-top: 10px;
            padding: 10px 15px;
            border-left: 4px solid var(--secondary);
            background: #e1f5fe;
            font-size: 14px;
            border-radius: 0 8px 8px 0;
            display: none;
        }
        .footer-tools {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #1b5e20; }
        .btn:disabled {
            background-color: #bdbdbd;
            cursor: not-allowed;
        }
        .hint-text {
            font-size: 14px;
            color: #757575;
            font-style: italic;
        }
        #result-screen {
            text-align: center;
            display: none;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            font-size: 36px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px auto;
            border: 4px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <h1 id="quiz-title">Evaluación: Medio Ambiente</h1>
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        
        <div class="question-box">
            <h2 id="question-text">Cargando pregunta...</h2>
            <div class="hint-text" id="hint-box" style="margin-bottom: 15px;"></div>
            <ul class="options-list" id="options-container"></ul>
        </div>

        <div class="footer-tools">
            <span id="question-counter" style="font-weight: 500;">Pregunta 1 de 10</span>
            <button class="btn" id="next-btn" disabled onclick="nextQuestion()">Siguiente</button>
        </div>
    </div>

    <div id="result-screen">
        <h1>¡Evaluación Finalizada!</h1>
        <p>Tu resultado global es:</p>
        <div class="score-circle" id="score-box">0/10</div>
        <p id="result-message" style="font-size: 18px; margin-bottom: 30px;"></p>
        <button class="btn" onclick="restartQuiz()">Intentar de nuevo</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "De los siguientes elementos, ¿cuál clasifica estrictamente como un componente biótico del ecosistema?",
            hint: "Busca la opción que represente a un organismo vivo o que interactúe activamente en las cadenas alimentarias.",
            options: [
                { text: "Los hongos y bacterias que descomponen la materia.", rationale: "Los microorganismos como hongos y bacterias son seres vivos, por lo tanto, forman parte de los elementos bióticos.", isCorrect: true },
                { text: "La luz solar que activa la fotosíntesis.", rationale: "La luz solar es una fuente de energía indispensable, pero al no tener vida se clasifica como un factor abiótico.", isCorrect: false },
                { text: "El agua dulce de los ríos y lagos.", rationale: "El agua es vital para el desarrollo de la vida, pero en sí misma es un componente inerte o abiótico.", isCorrect: false },
                { text: "Los nutrientes disueltos en el suelo.", rationale: "El suelo y sus minerales sirven de soporte y nutrición, pero corresponden al grupo de elementos abióticos.", isCorrect: false }
            ]
        },
        {
            question: "¿Qué función principal cumple el aire como elemento abiótico en el medio ambiente?",
            hint: "Piensa en qué gases invisibles necesitas inhalar constantemente y cuáles necesitan las plantas.",
            options: [
                { text: "Contiene gases esenciales como el oxígeno y el dióxido de carbono que permiten la respiración.", rationale: "El aire aporta los gases químicos necesarios para los procesos vitales de plantas, animales y seres humanos.", isCorrect: true },
                { text: "Sostiene físicamente las raíces de todas las plantas terrestres.", rationale: "El anclaje y soporte mecánico de las plantas es una función que le corresponde principalmente al suelo.", isCorrect: false },
                { text: "Actúa como la única fuente de energía lumínica del planeta.", rationale: "La energía lumínica del sistema proviene directamente del sol, no de la mezcla de gases del aire.", isCorrect: false },
                { text: "Determina directamente los minerales que absorben los animales.", rationale: "Los minerales se obtienen a través del agua y del suelo, o mediante la ingesta de otros seres vivos.", isCorrect: false }
            ]
        },
        {
            question: "Los elementos sociales demuestran que el medio ambiente no es solo la naturaleza virgen. ¿Cuál de los siguientes es un ejemplo de elemento social?",
            hint: "Identifica los objetos o actividades que requieren obligatoriamente de la intervención o fabricación humana.",
            options: [
                { text: "Las carreteras, edificios y las actividades industriales creadas por el ser humano.", rationale: "Las infraestructuras y las actividades socioeconómicas modifican el entorno y forman parte del medio ambiente social.", isCorrect: true },
                { text: "Las selvas tropicales y las corrientes marinas.", rationale: "Tanto las selvas como los océanos se desarrollan de forma natural sin la intervención de la infraestructura humana.", isCorrect: false },
                { text: "Las poblaciones de animales silvestres en peligro de extinción.", rationale: "Los animales de vida silvestre forman parte del componente biótico de la naturaleza, no del entorno social.", isCorrect: false },
                { text: "La temperatura y el clima de una región geográfica.", rationale: "El clima es un factor físico y geográfico que pertenece al ámbito de los elementos abióticos.", isCorrect: false }
            ]
        },
        {
            question: "¿Cuándo se produce específicamente un 'problema ambiental' según los conceptos estudiados?",
            hint: "El núcleo del problema ambiental radica en una ruptura del balance causada por acciones humanas.",
            options: [
                { text: "Cuando las actividades de los seres humanos alteran el equilibrio natural de la naturaleza.", rationale: "Los problemas ambientales surgen cuando las modificaciones antropogénicas superan la capacidad de autorregulación del ecosistema.", isCorrect: true },
                { text: "Cuando las plantas realizan la fotosíntesis usando la luz del sol.", rationale: "La fotosíntesis es un proceso natural y equilibrado que sustenta la vida, no representa una dificultad.", isCorrect: false },
                { text: "Cuando los animales carnívoros cazan a los herbívoros en las redes tróficas.", rationale: "La depredación es una interacción biológica natural que mantiene estables las poblaciones del ecosistema.", isCorrect: false },
                { text: "Cada vez que llueve de manera regular durante la temporada correspondiente.", rationale: "El ciclo normal de lluvias es un proceso meteorológico saludable y esperado en las diferentes regiones.", isCorrect: false }
            ]
        },
        {
            question: "Si una fábrica arroja residuos químicos y aceites a un río local, ¿qué tipo de contaminación ambiental se está generando de forma directa?",
            hint: "Analiza cuál de los tres recursos abióticos principales (aire, agua o suelo) está recibiendo el vertido directamente.",
            options: [
                { text: "Contaminación del agua.", rationale: "La introducción de sustancias nocivas directamente en los cuerpos de agua altera su calidad y daña la vida acuática.", isCorrect: true },
                { text: "Contaminación del aire.", rationale: "Aunque puede haber olores, el impacto directo e inmediato del vertido ocurre sobre el recurso hídrico.", isCorrect: false },
                { text: "Deforestación masiva.", rationale: "La deforestación se refiere estrictamente a la tala o remoción de la cobertura arbórea de los bosques.", isCorrect: false },
                { text: "Cambio climático global.", rationale: "El cambio climático se asocia con la acumulación de gases de efecto invernadero en la atmósfera alta.", isCorrect: false }
            ]
        },
        {
            question: "¿Cuál es una consecuencia ecológica directa e inmediata de la deforestación?",
            hint: "Los árboles funcionan como la 'casa' y protección de la fauna; piensa qué pasa si les quitas esa estructura.",
            options: [
                { text: "Se pierde el hábitat y hogar de numerosas especies de animales.", rationale: "Al talar los árboles, las especies forestales pierden refugio, alimento y las condiciones óptimas para sobrevivir.", isCorrect: true },
                { text: "Aumenta la producción global de oxígeno en la atmósfera.", rationale: "Al contrario, al haber menos árboles, se reduce la capacidad global de fotosíntesis y liberación de oxígeno.", isCorrect: false },
                { text: "Se eliminan por completo los plásticos acumulados en la tierra.", rationale: "La deforestación no reduce los desechos inorgánicos, e incluso la maquinaria usada puede generar más residuos.", isCorrect: false },
                { text: "Disminuyen drásticamente las inundaciones y la erosión del suelo.", rationale: "La ausencia de raíces empeora la situación, haciendo que el suelo se erosione más rápido y aumenten las inundaciones.", isCorrect: false }
            ]
        },
        {
            question: "El aumento de la temperatura terrestre, las sequías prolongadas y el derretimiento de glaciares son efectos característicos de:",
            hint: "Es el fenómeno ambiental global impulsado por la retención excesiva de calor en la atmósfera.",
            options: [
                { text: "El cambio climático.", rationale: "Estas variaciones extremas en los patrones meteorológicos y térmicos globales definen la crisis del cambio climático.", isCorrect: true },
                { text: "La proliferación de residuos orgánicos.", rationale: "Los residuos orgánicos mal gestionados causan malos olores o plagas locales, pero no el deshielo directo de los polos.", isCorrect: false },
                { text: "El desarrollo de redes tróficas estables.", rationale: "Una red trófica estable equilibra el ecosistema en lugar de generar catástrofes climáticas.", isCorrect: false },
                { text: "La purificación natural del suelo.", rationale: "Los fenómenos mencionados deterioran la superficie terrestre y aceleran la desertificación, no la purifican.", isCorrect: false }
            ]
        },
        {
            question: "Tienes un contenedor para residuos Orgánicos. ¿Cuál de los siguientes desechos debe depositarse allí?",
            hint: "Lo orgánico proviene directamente de la naturaleza viva y de alimentos que pueden descomponerse rápidamente.",
            options: [
                { text: "Restos de frutas, verduras y residuos de la poda del jardín.", rationale: "Los restos de comida y plantas provienen de materia viva y se degradan de forma biológica natural.", isCorrect: true },
                { text: "Botellas de vidrio y latas de aluminio vacías.", rationale: "El vidrio y los metales son materiales inorgánicos que tardan siglos en degradarse y se manejan en rutas de reciclaje técnico.", isCorrect: false },
                { text: "Envases plásticos y bolsas de supermercado.", rationale: "Los plásticos son compuestos derivados del petróleo que entran en la categoría de inorgánicos reciclables o no reciclables.", isCorrect: false },
                { text: "Baterías usadas de teléfonos y medicamentos vencidos.", rationale: "Estos elementos poseen compuestos tóxicos y peligrosos, por lo que requieren un manejo especial y seguro.", isCorrect: false }
            ]
        },
        {
            question: "¿Qué diferencia fundamental hay entre los residuos inorgánicos Reciclables y los No Reciclables?",
            hint: "La palabra clave es 'procesar'. Piensa en qué materiales se pueden fundir o transformar en algo nuevo.",
            options: [
                { text: "Los reciclables se pueden procesar para fabricar nuevos productos, mientras que los no reciclables no.", rationale: "El reciclaje busca reintroducir el papel, plástico o metal limpio al ciclo productivo, lo cual es inviable con pañales o residuos médicos.", isCorrect: true },
                { text: "Los reciclables se componen exclusivamente de restos de comida orgánica descompuesta.", rationale: "Los restos de comida son orgánicos; la categoría reciclable de la que se habla aquí se refiere a materiales inorgánicos secos.", isCorrect: false },
                { text: "Los no reciclables desaparecen de la naturaleza en menos de veinticuatro horas.", rationale: "Los residuos no reciclables como los pañales plásticos tardan cientos de años en degradarse en los vertederos.", isCorrect: false },
                { text: "Los reciclables son siempre dañinos y tóxicos para la salud humana al contacto directo.", rationale: "Los materiales limpios destinados al reciclaje no son inherentemente peligrosos, a diferencia de los residuos biosanitarios.", isCorrect: false }
            ]
        },
        {
            question: "¿Por qué las baterías y los productos químicos vencidos se clasifican bajo la categoría de 'Residuos peligrosos'?",
            hint: "Tienen advertencias especiales y símbolos de corrosión debido a las sustancias químicas que llevan dentro.",
            options: [
                { text: "Porque contienen componentes con un alto potencial de daño a la salud humana y al medio ambiente.", rationale: "Su toxicidad, reactividad o corrosividad exige una recolección diferenciada para evitar envenenar suelos o fuentes de agua.", isCorrect: true },
                { text: "Porque se transforman fácilmente en abono orgánico para los cultivos de agricultura.", rationale: "Las baterías contienen metales pesados como el litio o cadmio que arruinarían las plantas y los alimentos si se usan como abono.", isCorrect: false },
                { text: "Porque son idénticos a los trozos de cartón y papel de las oficinas.", rationale: "El papel y el cartón no contienen químicos industriales peligrosos de alta toxicidad latente.", isCorrect: false },
                { text: "Porque se degradan inmediatamente al entrar en contacto con el aire de las ciudades.", rationale: "Los componentes químicos peligrosos persisten en el ambiente por mucho tiempo si no reciben un tratamiento adecuado.", isCorrect: false }
            ]
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        document.getElementById("next-btn").disabled = true;
        
        const currentQuestion = quizData[currentQuestionIndex];
        document.getElementById("question-text").innerText = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;
        document.getElementById("hint-box").innerText = `Pista: ${currentQuestion.hint}`;
        document.getElementById("question-counter").innerText = `Pregunta ${currentQuestionIndex + 1} de ${quizData.length}`;
        
        const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
        document.getElementById("progress").style.width = `${progressPercent}%`;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentQuestion.options.forEach((option, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = option.text;
            
            const rationaleDiv = document.createElement("div");
            rationaleDiv.className = "rationale";
            rationaleDiv.innerText = option.rationale;
            li.appendChild(rationaleDiv);

            li.onclick = () => selectOption(li, option.isCorrect, rationaleDiv);
            optionsContainer.appendChild(li);
        });
    }

    function selectOption(selectedLi, isCorrect, rationaleElement) {
        if (answered) return;
        answered = true;

        if (isCorrect) {
            selectedLi.classList.add("correct");
            score++;
        } else {
            selectedLi.classList.add("incorrect");
            // Mostrar también cuál era la correcta
            const items = document.querySelectorAll(".option-item");
            items.forEach((item, idx) => {
                if (quizData[currentQuestionIndex].options[idx].isCorrect) {
                    item.classList.add("correct");
                }
            });
        }

        rationaleElement.style.display = "block";
        document.getElementById("next-btn").disabled = false;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("quiz-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("score-box").innerText = `${score}/${quizData.length}`;
        
        const messageBox = document.getElementById("result-message");
        if (score >= 8) {
            messageBox.innerText = "¡Excelente trabajo! Tienes un gran dominio de los conceptos ecológicos y el manejo de residuos.";
            messageBox.style.color = "#2e7d32";
        } else if (score >= 5) {
            messageBox.innerText = "¡Buen intento! Conoces las nociones básicas, pero te vendría bien repasar las clasificaciones de residuos e impactos.";
            messageBox.style.color = "#0288d1";
        } else {
            messageBox.innerText = "Es recomendable repasar las infografías y volverlo a intentar para mejorar tu conciencia ambiental.";
            messageBox.style.color = "#c62828";
        }
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("quiz-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";
        loadQuestion();
    }

    // Inicializar
    window.onload = loadQuestion;
</script>

</body>
</html>
